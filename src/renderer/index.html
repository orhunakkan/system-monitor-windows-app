<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'">
  <title>System Monitor</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="window" class="window">
    <header class="headerbar">
      <div class="headerbar-start"></div>
      <div class="headerbar-title"></div>
      <div class="headerbar-end">
        <div class="windowcontrols">
          <button class="wc-button minimize" data-action="minimize" title="Minimize"><span class="wc-icon"></span></button>
          <button class="wc-button maximize" data-action="toggle-maximize" title="Maximize"><span class="wc-icon"></span></button>
          <button class="wc-button close" data-action="close" title="Close"><span class="wc-icon"></span></button>
        </div>
      </div>
    </header>
    <main id="content" class="content"></main>
  </div>
  <script src="format.js"></script>
  <script src="graph.js"></script>
  <script src="colorbutton.js"></script>
  <script src="widgets.js"></script>
  <script src="dialogs.js"></script>
  <script src="app.js"></script>
</body>
</html>
